name: Release

# Push a tag such as v1.0.0 to build the Windows installer and the macOS disk images and publish them on the
# GitHub Releases page. "Run workflow" (manual) builds everything and keeps it as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: >
          dotnet publish src/GitDash.App/GitDash.App.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }} -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\GitDash.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath dist\GitDash-${{ steps.version.outputs.value }}-win-x64-portable.zip

      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: dist/*

  macos-dmg:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          # CFBundleShortVersionString must be numeric (1.2.3), without a pre-release suffix.
          echo "plist=${v%%-*}" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained, ${{ matrix.rid }})
        run: >
          dotnet publish src/GitDash.App/GitDash.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.version.outputs.value }} -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Build GitDash.app
        run: |
          app="build/GitDash.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/GitDash"

          # Icon: .icns from the 256 px PNG
          set="build/AppIcon.iconset"; mkdir -p "$set"
          png="src/GitDash.App/Assets/app.png"
          for s in 16 32 64 128 256; do sips -z $s $s "$png" --out "$set/icon_${s}x${s}.png" >/dev/null; done
          cp "$set/icon_32x32.png"   "$set/icon_16x16@2x.png"
          cp "$set/icon_64x64.png"   "$set/icon_32x32@2x.png"
          cp "$set/icon_256x256.png" "$set/icon_128x128@2x.png"
          rm "$set/icon_64x64.png"
          iconutil -c icns "$set" -o "$app/Contents/Resources/AppIcon.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>GitDash</string>
            <key>CFBundleDisplayName</key><string>GitDash</string>
            <key>CFBundleIdentifier</key><string>com.solitontech.gitdash</string>
            <key>CFBundleExecutable</key><string>GitDash</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.plist }}</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature: required for the app to start on Apple silicon. It is not notarised (see README note).
          codesign --force --deep --sign - "$app"

      # Signing every release with the same certificate gives the app a stable identity, so macOS keeps trusting it with the
      # Keychain entry that holds the GitHub token (no password prompt after each update). Needs the repository secrets
      # MACOS_CERT_P12 (base64 of the .p12) and MACOS_CERT_PASSWORD, made by scripts/make-macos-signing-cert.sh. Without
      # them the app keeps the ad-hoc signature from the previous step.
      - name: Sign with the release certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "No MACOS_CERT_P12 secret: keeping the ad-hoc signature."; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not "valid" to the system, so look it up by hash without the -v filter.
          identity="$(security find-identity -p codesigning "$keychain" | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          if [ -z "$identity" ]; then echo "The certificate has no code-signing identity."; exit 1; fi
          codesign --force --deep --sign "$identity" --keychain "$keychain" build/GitDash.app
          codesign --verify --deep --strict build/GitDash.app
          # The designated requirement is what the Keychain remembers; it must be the same for every release.
          codesign -dr - build/GitDash.app
          security delete-keychain "$keychain"

      - name: Build the disk image
        run: |
          mkdir -p dist dmg
          cp -R build/GitDash.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "GitDash" -srcfolder dmg -ov -format UDZO \
            "dist/GitDash-${{ steps.version.outputs.value }}-${{ matrix.rid }}.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-macos-${{ matrix.rid }}
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [windows-installer, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: GitDash ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  # Proposes the release version for main so local builds do not offer an update to the version they already are.
  # Requires the repository setting "Allow GitHub Actions to create and approve pull requests".
  sync-version:
    if: github.ref_type == 'tag'
    needs: [release]
    runs-on: ubuntu-latest
    continue-on-error: true   # the release itself is already out even if syncing fails
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Write the release version into Directory.Build.props
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" == *-* ]]; then echo "Pre-release $v: nothing to sync"; exit 0; fi
          sed -i -E "s#<Version>[^<]*</Version>#<Version>${v}</Version>#" Directory.Build.props
          if git diff --quiet; then echo "Already $v"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="sync-version/${GITHUB_REF_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git add Directory.Build.props
          git commit -m "Version ${v}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Version ${v}" \
            --body "Sync the source version with the published ${GITHUB_REF_NAME} release."
